<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Agent console{% endblock %}</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --card:#f6f8fa;
          --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; --link:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --line:#30363d; --card:#161b22;
            --ok:#3fb950; --warn:#d29922; --bad:#f85149; --link:#4493f8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:1.25rem; align-items:center; padding:.75rem 1rem; border-bottom:1px solid var(--line);
           flex-wrap:wrap; }
  header strong { margin-right:auto; }
  main { max-width:1100px; margin:0 auto; padding:1rem; }
  a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
  h1 { font-size:1.4rem; margin:.5rem 0 1rem; } h2 { font-size:1.1rem; margin:1.5rem 0 .5rem; }
  .muted { color:var(--muted); } .small { font-size:.85rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1rem; margin-bottom:1rem; }
  .table-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:.45rem .6rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:.8rem; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .pill { display:inline-block; padding:0 .5rem; border-radius:999px; border:1px solid currentColor; font-size:.8rem; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  form.inline { display:inline; }
  button { font:inherit; padding:.25rem .7rem; border-radius:6px; border:1px solid var(--line);
           background:var(--bg); color:var(--fg); cursor:pointer; }
  button:hover { border-color:var(--fg); }
  textarea { width:100%; font:inherit; padding:.5rem; border-radius:6px; border:1px solid var(--line);
             background:var(--bg); color:var(--fg); }
  pre { white-space:pre-wrap; word-break:break-word; margin:.25rem 0; font-size:.85rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:.75rem; }
  .stat { font-size:1.4rem; font-weight:600; }
</style>
</head>
<body>
<header>
  <strong>🛡️ Agent console</strong>
  <a href="/console">Agents</a>
  <a href="/console/review">Review</a>
  <a href="/console/chat">Chat</a>
  <a href="http://localhost:3000" target="_blank">Grafana ↗</a>
  <a href="/architecture" target="_blank">Docs ↗</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
