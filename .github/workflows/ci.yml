# Checks on every pull request against main (and again on main after merge).
# No Cloudflare account needed: the Worker runs end to end in the tests with
# D1 on SQLite and a scripted Workers AI (test/fakes.ts).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Bundles the Worker and validates wrangler.jsonc and its bindings
      # without deploying, so config errors fail the PR instead of the deploy
      - name: Build Worker (dry run)
        run: npx wrangler deploy --dry-run --outdir dist

  security:
    name: Dependencies & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Fails on known high or critical vulnerabilities in any dependency
      - name: npm audit
        run: npm audit --audit-level=high

      # Fails if an API key, token or password was ever committed
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
