# =============================================================================
# LLMOps Platform — Agent evals against the real model
#
# Runs the task suite through the gateway with a real provider and fails when
# the pass rate or the cost per task regress beyond evals/baseline.json.
# The results table is added to the job summary.
#
# REQUIRED GITHUB CONFIGURATION (Settings > Secrets and variables > Actions):
#   Secrets:   ANTHROPIC_API_KEY and/or OPENAI_API_KEY
#   Variables: AGENT_PROVIDER, ANTHROPIC_MODEL, OPENAI_MODEL (optional)
#
# Without keys the job is skipped with a warning (forks, first setup).
# =============================================================================

name: Agent evals

on:
  pull_request:
    branches: [main]
    paths:
      - 'agent/**'
      - 'gateway/**'
      - 'config/**'
      - 'evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    name: Quality and cost gate
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5-5' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      SEED_DEMO_DATA: 'false'
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for API keys
        id: keys
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::No ANTHROPIC_API_KEY / OPENAI_API_KEY secret: skipping the real-model evals."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write .env from secrets
        if: steps.keys.outputs.present == 'true'
        run: |
          {
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
            echo "OPENAI_API_KEY=$OPENAI_API_KEY"
            echo "AGENT_PROVIDER=$AGENT_PROVIDER"
            echo "ANTHROPIC_MODEL=$ANTHROPIC_MODEL"
            echo "OPENAI_MODEL=$OPENAI_MODEL"
            echo "SEED_DEMO_DATA=$SEED_DEMO_DATA"
          } > .env

      - name: Start gateway
        if: steps.keys.outputs.present == 'true'
        run: |
          mkdir -p results && chmod 777 results   # agent container runs as uid 10001
          docker compose up -d --build --wait --wait-timeout 180 db gateway

      - name: Run the eval suite with the gate
        if: steps.keys.outputs.present == 'true'
        run: docker compose run --rm agent --gate

      - name: Job summary
        if: always() && steps.keys.outputs.present == 'true'
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path("results/eval_summary.json")
          if not path.exists():
              print("No eval summary was produced."); raise SystemExit
          s = json.loads(path.read_text())
          print(f"### Agent evals — {s['model']}\n")
          print(f"**Pass rate {s['pass_rate']:.0%}** · avg ${s['avg_cost_usd']:.4f}/task · "
                f"total ${s['total_cost_usd']:.4f} · avg {s['avg_steps']} steps\n")
          print("| Task | Result | Status | Steps | Cost |\n|---|---|---|---|---|")
          for r in s["results"]:
              print(f"| {r['task_id']} | {'✅' if r['passed'] else '❌'} | {r['status']} | {r['steps']} | ${r['cost_usd']:.4f} |")
          PY

      - name: Stop
        if: always()
        run: docker compose down -v
