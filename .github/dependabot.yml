# Weekly pull requests for outdated or vulnerable dependencies and actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # Types must match the Node major the project runs on (22, see the
      # workflows): @types/node 26 describes a different fs API and breaks
      # the typecheck. Bump it together with the Node version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
