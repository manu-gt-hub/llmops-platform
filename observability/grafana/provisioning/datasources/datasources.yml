apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: llmops-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: ${POSTGRES_USER}
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}

  - name: Prometheus
    uid: llmops-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 15s

  - name: Tempo
    uid: llmops-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
